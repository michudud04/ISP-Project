[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivoltaics"
version = "0.1.0"
description = "Intelligent decision-support system for the stakeholders of an agrivoltaic farm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
